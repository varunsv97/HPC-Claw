[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hpc-assistant-tui"
version = "0.1.0"
description = "Python Textual TUI for the hpc-assistant project."
requires-python = ">=3.14,<3.15"
dependencies = [
    "textual>=0.47,<2.0",
]

[project.scripts]
hpc-assistant = "hpc_assistant_tui.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
