[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hpc-claw"
version = "0.1.0"
description = "Python runtime and configuration layer for HPC Claw."
requires-python = ">=3.14,<3.15"
dependencies = [
    "openai>=1.107.0,<2.0",
    "pydantic-settings>=2.13.1,<3.0",
    "dspy>=2.6.0,<3.0",
    "textual>=3.2.0",
]

[project.scripts]
hpc-claw = "claw_backend.cli:main"
hpc-claw-tui = "claw_tui.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2,<10.0",
    "pytest-asyncio>=1.3.0,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
