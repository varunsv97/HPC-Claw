[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hpc-assistant-backend"
version = "0.1.0"
description = "Python runtime and configuration layer for the HPC assistant backend."
requires-python = ">=3.14,<3.15"
dependencies = [
    "openai>=1.107.0,<2.0",
    "pydantic-settings>=2.13.1,<3.0",
]

[project.scripts]
hpc-assistant-backend = "hpc_assistant_backend.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2,<10.0",
    "pytest-asyncio>=1.3.0,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
