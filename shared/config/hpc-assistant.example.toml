# HPC Claw — legacy reference file for the first cluster-testing prototype.
#
# The current backend reads environment variables through `AssistantSettings`
# rather than parsing this file directly. Keep this file as operator-facing
# documentation for the recommended environment variable values.

[backend]
package = "hpc-assistant-backend"
store_path = "~/.hpcassist"

[openai]
api_key_env = "HPC_ASSISTANT_OPENAI_API_KEY"
base_url_env = "HPC_ASSISTANT_OPENAI_BASE_URL"
model_env = "HPC_ASSISTANT_OPENAI_MODEL"
default_model = "gpt-5"

[cluster]
command_timeout_seconds = 15.0
allow_cluster_probe_jobs = false
guardrails_enabled = true

[filesystem]
roots_env = "HPC_ASSISTANT_FILESYSTEM_ROOTS"
roots_json_example = "[\"~\", \"~/scratch\"]"

# Files matching these glob patterns are write-protected at the backend level.
# Patterns are matched against relative paths inside each filesystem root and
# against full absolute paths.  Standard Unix shell globs are supported.
# Set via env var:  HPC_ASSISTANT_READONLY_PATHS='["Makefile","src/generated/**","*.lock"]'
# Or in the repo-local opencode.json:  "readonly_paths": ["Makefile", "*.lock"]
readonly_paths_env = "HPC_ASSISTANT_READONLY_PATHS"
readonly_paths_json_example = "[\"Makefile\", \"*.lock\", \"src/generated/**\"]"
